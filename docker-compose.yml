services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prosper
      POSTGRES_USER: prosper
      POSTGRES_PASSWORD: prosper
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosper -d prosper"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── One-shot DB seeder ──────────────────────────────────────────────────────
  seed:
    build:
      context: ./backend
      target: runtime
    command: python db/seed.py
    environment:
      DATABASE_URL: postgresql://prosper:prosper@postgres:5432/prosper
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # ── Backend services ────────────────────────────────────────────────────────
  bot:
    build:
      context: ./backend
      target: runtime
    # --host 0.0.0.0 ensures the Pipecat runner binds on all interfaces,
    # not just loopback, so nginx in the frontend container can reach it.
    command: python bot.py --host 0.0.0.0
    ports:
      - "7860:7860"
    environment:
      DATABASE_URL: postgresql://prosper:prosper@postgres:5432/prosper
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    networks:
      - backend
      - services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  api:
    build:
      context: ./backend
      target: runtime
    command: python api.py
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://prosper:prosper@postgres:5432/prosper
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    networks:
      - backend
      - services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/agent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    networks:
      - services
    depends_on:
      bot:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  # backend: postgres + redis only — not reachable from the frontend container
  backend:
    driver: bridge
    internal: true
  # services: bot + api + frontend — allows nginx to proxy to the two backend services
  services:
    driver: bridge

volumes:
  postgres_data:
