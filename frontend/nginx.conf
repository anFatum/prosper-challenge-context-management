server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so service hostnames are re-resolved dynamically
    # rather than cached once at nginx startup (the default, which causes 502s
    # when a container IP differs from what was resolved at launch time).
    resolver 127.0.0.11 valid=10s;

    # Pipecat bot — WebRTC signaling (more-specific paths before the /api catch-all)
    location /start {
        set $bot http://bot:7860;
        proxy_pass $bot;
        proxy_set_header Host $host;
    }
    location /sessions {
        set $bot http://bot:7860;
        proxy_pass $bot;
        proxy_set_header Host $host;
    }
    location /api/offer {
        set $bot http://bot:7860;
        proxy_pass $bot;
        proxy_set_header Host $host;
    }

    # Agent REST API
    location /api {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # SPA fallback — let React Router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}